version: '3.8'

services:
  smartqueue:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: smartqueue-appliance
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - queue-data:/app/data
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DB_PATH=/app/data/smartqueue.db
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://localhost:3000/api/meta', (r) => { process.exit(r.statusCode === 200 ? 0 : 1); });\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  queue-data:
    name: smartqueue_db_data
